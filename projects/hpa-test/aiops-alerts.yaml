apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiops-demo-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: aiops-demo
    rules:
    - alert: HighCPUUsage
      expr: sum(rate(container_cpu_usage_seconds_total{namespace="default",pod=~"hpa-demo.*"}[5m])) by (pod) > 0.3
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Pod {{ $labels.pod }} CPU 使用过高"
        description: "CPU 使用超过 0.3 核，持续 1 分钟"
