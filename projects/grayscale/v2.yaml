apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo
      version: v2
  template:
    metadata:
      labels:
        app: demo
        version: v2
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: v2-html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: v2-html
data:
  index.html: |
    <h1>Version 2</h1>
---
apiVersion: v1
kind: Service
metadata:
  name: app-v2
spec:
  selector:
    app: demo
    version: v2
  ports:
  - port: 80
    targetPort: 80
