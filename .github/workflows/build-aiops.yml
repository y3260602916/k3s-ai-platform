name: Build AIOps Agent

on:
  push:
    branches: [main]
    paths:
      - 'projects/aiops-agent/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./projects/aiops-agent
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/aiops-agent:latest
            ghcr.io/${{ github.repository }}/aiops-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
