---
- name: 部署业务应用
  hosts: local
  become: yes
  vars:

  tasks:
    - name: 登录 Harbor
      shell: |
        docker login {{ harbor_hostname }}:{{ harbor_port }} -u {{ harbor_user }} -p {{ harbor_password }}
      changed_when: false

    - name: 构建 hpa-demo 镜像
      shell: |
        cd {{ project_dir }}/projects/hpa-test
        docker build -t hpa-demo:v3 .

    - name: 推送 hpa-demo 镜像到 Harbor
      shell: |
        docker tag hpa-demo:v3 {{ harbor_hostname }}:{{ harbor_port }}/library/hpa-demo:v3
        docker push {{ harbor_hostname }}:{{ harbor_port }}/library/hpa-demo:v3

    - name: 构建 aiops-agent 镜像
      shell: |
        cd {{ project_dir }}/projects/aiops-agent
        docker build -t aiops-agent:v6 .

    - name: 推送 aiops-agent 镜像到 Harbor
      shell: |
        docker tag aiops-agent:v6 {{ harbor_hostname }}:{{ harbor_port }}/library/aiops-agent:v6
        docker push {{ harbor_hostname }}:{{ harbor_port }}/library/aiops-agent:v6

    - name: 创建 ServiceAccount
      shell: |
        kubectl create serviceaccount aiops-sa --dry-run=client -o yaml | kubectl apply -f -

    - name: 创建 ClusterRole
      shell: |
        kubectl create clusterrole aiops-role \
          --verb=get,list --resource=pods,pods/log \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: 创建 ClusterRoleBinding
      shell: |
        kubectl create clusterrolebinding aiops-binding \
          --clusterrole=aiops-role \
          --serviceaccount=default:aiops-sa \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: 检查 Secret 是否存在
      shell: |
        kubectl get secret aiops-secret -o name 2>/dev/null || echo "not-exist"
      register: secret_check
      changed_when: false

    - name: 创建 Secret
      shell: |
        kubectl create secret generic aiops-secret --from-literal=api-key={{ zhipu_api_key }}
      when: "'not-exist' in secret_check.stdout"
      no_log: true

    - name: 部署 MySQL
      shell: |
        kubectl apply -f {{ project_dir }}/projects/aiops-agent/mysql.yaml

    - name: 等待 MySQL 就绪
      shell: |
        kubectl wait --for=condition=Ready pod -l app=mysql --timeout=180s

    - name: 创建 diagnosis_reports 表
      shell: |
        MYSQL_POD=$(kubectl get pods -l app=mysql -o jsonpath='{.items[0].metadata.name}')
        kubectl exec $MYSQL_POD -- mysql -uroot -pAiops123456 aiops -e "
        CREATE TABLE IF NOT EXISTS diagnosis_reports (
          id INT AUTO_INCREMENT PRIMARY KEY,
          alertname VARCHAR(100),
          namespace VARCHAR(100),
          pod VARCHAR(200),
          description TEXT,
          diagnosis TEXT,
          llm_duration FLOAT,
          total_duration FLOAT,
          created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
        );
        "

    - name: 部署 AIOps
      shell: |
        kubectl apply -f {{ project_dir }}/projects/aiops-agent/deploy.yaml

    - name: 部署 hpa-demo
      shell: |
        kubectl apply -f {{ project_dir }}/projects/hpa-test/app.yaml

    - name: 等待 AIOps 就绪
      shell: |
        kubectl wait --for=condition=Ready pod -l app=aiops-agent --timeout=180s

    - name: 等待 hpa-demo 就绪
      shell: |
        kubectl wait --for=condition=Ready pod -l app=hpa-demo --timeout=180s

    - name: 查看 Pod 状态
      command: kubectl get pods
      register: pods_status
      changed_when: false

    - name: 显示状态
      debug:
        msg: "{{ pods_status.stdout }}"

    - name: 部署 Prometheus 告警规则
      shell: |
        kubectl apply -f {{ project_dir }}/projects/hpa-test/aiops-alerts.yaml

    - name: 部署灰度发布 v1/v2
      shell: |
        cd {{ project_dir }}/projects/grayscale
        sed -i 's|47.113.189.149|{{ k3s_master_ip }}|g' *.yaml
        sed -i 's|172.28.115.120|{{ k3s_master_ip }}|g' *.yaml
        kubectl apply -f v1.yaml
        kubectl apply -f v2.yaml
        kubectl apply -f ingress-v1.yaml
        kubectl apply -f ingress-v2-canary.yaml

    - name: 部署 ServiceMonitor
      shell: |
        kubectl apply -f {{ project_dir }}/projects/hpa-test/servicemonitor.yaml

    - name: 部署 KEDA ScaledObject
      shell: |
        kubectl apply -f {{ project_dir }}/projects/hpa-test/scaledobject.yaml
