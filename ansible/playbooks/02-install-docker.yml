---
- name: 安装Docker
  hosts: local
  become: yes
  tasks:
    - name: 安装依赖
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: 创建 keyrings 目录
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 下载 Docker GPG 密钥
      get_url:
        url: https://mirrors.aliyun.com/docker-ce/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: 添加 Docker 软件源
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://mirrors.aliyun.com/docker-ce/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: 安装 Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: 创建 docker 配置目录
      file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: 配置 Docker 镜像加速
      copy:
        dest: /etc/docker/daemon.json
        content: |
          {
            "registry-mirrors": [
              "https://docker.m.daocloud.io",
              "https://dockerproxy.com",
              "https://docker.nju.edu.cn"
            ],
            "insecure-registries": ["{{ ansible_default_ipv4.address }}:8081"]
          }
      notify: restart docker

    - name: 启动 Docker
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: 验证 Docker
      command: docker --version
      register: docker_version
      changed_when: false

    - name: 显示版本
      debug:
        msg: "{{ docker_version.stdout }}"

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted
